<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- SCREEN 1: Main Menu -->
  <div id="menuView">
    <div class="header">
      <div class="user-info">
        <span class="title">Sticky Notes</span>
      </div>
      <div class="actions">
        <button id="themeToggleBtn" class="backup-btn theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8z"></path></svg>
          <svg class="theme-icon-sun hidden" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </button>
        <button id="settingsBtn" class="backup-btn" title="Open settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0L6.2 6.08a2 2 0 1 0-2 3.46l.15.08a2 2 0 0 1 1 1.73v.5a2 2 0 0 1-1 1.73l-.15.08a2 2 0 1 0 2 3.46l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 1 0 2-3.46l-.15-.08a2 2 0 0 1-1-1.73v-.5a2 2 0 0 1 1-1.73l.15-.08a2 2 0 1 0-2-3.46l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="exportJsonBtn" class="backup-btn" title="Generate backup" aria-label="Generate backup">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>
          </svg>
        </button>
        <button id="importJsonBtn" class="backup-btn" title="Import backup" aria-label="Import backup">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3"></path><path d="m17 8-5-5-5 5"></path><path d="M5 21h14"></path>
          </svg>
        </button>
        <input id="importJsonInput" type="file" accept="application/json,.json" class="hidden">
        <button id="newNoteBtn" class="primary-btn" title="New Note">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New
        </button>
      </div>
    </div>
    <div id="onboardingLegend" class="ftue-guide hidden" role="status" aria-label="Sticky Notes quick guide">
      <div class="ftue-callout ftue-theme"><span>Theme</span><i>↑</i></div>
      <div class="ftue-callout ftue-settings"><span>Settings</span><i>↑</i></div>
      <div class="ftue-callout ftue-export"><span>Export</span><i>↑</i></div>
      <div class="ftue-callout ftue-import"><span>Import</span><i>↑</i></div>
      <div class="ftue-callout ftue-new"><span>New note</span><i>↑</i></div>
      <div class="ftue-hint">Click any button to start</div>
    </div>
    <div id="searchContainer" class="search-container">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="#9ca3af" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search text or site...">
      </div>
      <button id="siteFilterBtn" class="site-filter-btn" type="button">All notes</button>
      <button id="favoriteFilterBtn" class="site-filter-btn" type="button">Favorites</button>
      <button id="recentlyDeletedBtn" class="site-filter-btn" type="button">Recently Deleted</button>
      <select id="categoryFilter" class="category-filter" aria-label="Filter notes by category">
        <option value="all">All categories</option>
      </select>
    </div>
    <div id="notesList"></div>
  </div>

  <!-- SCREEN 2: Note Editor -->
  <div id="editView" class="hidden">
    <div class="header">
      <button id="backBtn" class="text-btn" title="Back to menu">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </button>
      <div class="actions">
        <button id="pinBtn" title="Keep note visible on the page" aria-label="Keep note visible on the page">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4 5 5-3 1-4 4 2 2-1 1-2-2-4 4-1-1 4-4-2-2 1-1 2 2 4-4 1-3z"></path></svg>
        </button>
        <button id="lockBtn" title="Read-Only Mode">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        </button>
        <button id="favoriteBtn" title="Add to favorites" aria-label="Add to favorites">☆</button>
        <button id="deleteBtn" title="Delete note">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>
    
    <div class="format-toolbar" id="formatToolbar">
      <button id="insertChecklistBtn" title="Insert checklist">☑</button>
      <button id="btnBold" title="Bold (Ctrl+B)" style="font-weight: bold;">B</button>
      <button id="btnItalic" title="Italic (Ctrl+I)" style="font-style: italic;">I</button>
      <button id="btnUnderline" title="Underline (Ctrl+U)" style="text-decoration: underline;">U</button>
    </div>

    <div class="site-field">
      <span>Associated site</span>
      <strong id="noteUrlDisplay">Unassigned site</strong>
    </div>
    <label class="site-field" for="noteTagsInput">
      <span>Tags</span>
      <div id="tagEditor" class="tag-editor">
        <div id="tagChips" class="tag-chips"></div>
        <input id="noteTagsInput" type="text" placeholder="type a tag">
      </div>
    </label>
    <label class="site-field" for="noteCategoryInput">
      <span>Category</span>
      <input id="noteCategoryInput" type="text" placeholder="e.g. Travel plans">
    </label>
    
    <div id="noteArea" contenteditable="true" data-placeholder="Write something... it auto-saves."></div>
    <div class="footer"><span id="status"></span></div>
  </div>

  <div id="deleteModal" class="modal-backdrop hidden" role="presentation">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </div>
      <h2 id="deleteTitle">Delete this note?</h2>
      <p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button id="cancelDeleteBtn" class="modal-cancel">Cancel</button>
        <button id="confirmDeleteBtn" class="modal-delete">Delete note</button>
      </div>
    </div>
  </div>

  <div id="undoToast" class="undo-toast hidden" role="status">
    <span>Note deleted</span>
    <button id="undoDeleteBtn" type="button">Undo</button>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
